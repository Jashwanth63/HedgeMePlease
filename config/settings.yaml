app:
  name: "AlpachaBot"
  paper: true
  dry_run: false
  db_path: "data/alpacha.db"
  models_dir: "data/models"

data:
  symbols:
    # Core Broad Market & Sector ETFs
    - "SPY"
    - "QQQ"
    - "IWM"
    - "VOO"
    - "VTI"
    - "VT"
    - "IVV"
    # Fixed Income / Treasury Bonds (Hedge)
    - "TLT"
    # Commodities, Energy & Precious Metals (Hedge)
    - "GLD"
    - "SLV"
    - "USO"
    - "XLE"
    # High-Beta & Growth Equities
    - "COIN"
    - "NVDA"
    - "TSLA"
    - "AMD"
    - "META"
    - "MSFT"
    - "AAPL"
    - "GOOGL"
    - "AMZN"
    # Financials, Healthcare & Value Blue-Chips
    - "BRK.B"
    - "JPM"
    - "COST"
    - "JNJ"
  timeframe: "1Min"
  history_days: 90
  refresh_interval_sec: 60

model:
  daily_lags: 1
  weekly_lags: 5
  monthly_lags: 22
  use_leverage: true
  use_jumps: true
  jump_alpha: 0.01
  iv_vs_rv_multiple: 1.2
  retrain_if_older_days: 5
  min_train_days: 20

risk:
  warn_drawdown_pct: 0.02       # 2.0% warning threshold (reduce sizing & block entries)
  kill_drawdown_pct: 0.035      # 3.5% hard kill switch (liquidate & stop)
  max_portfolio_bp_pct: 0.30    # Maximum 30% buying power allocation
  max_contracts_per_trade: 10   # Increased to 10 contracts per trade
  single_trade_max_loss_pct: 0.03 # 3% risk allocation per trade
  use_risk_parity: true         # Inverse-volatility weighting across asset classes
  target_annualized_vol: 0.15   # Benchmark volatility for sizing
  caps:
    equity_max_pct: 0.50        # Max 50% exposure in Equities
    fixed_income_max_pct: 0.25  # Max 25% exposure in Fixed Income (TLT)
    commodities_max_pct: 0.25   # Max 25% exposure in Commodities (GLD, SLV, USO, XLE)
    single_symbol_max_pct: 0.08 # Max 8% exposure in any single ticker

strategy:
  target_delta: 0.20
  delta_tolerance: 0.08
  min_dte: 0
  max_dte: 45
  target_dte: 2
  macro_buffer_hours: 2.0
  min_credit: 0.20              # Minimum credit in $ per spread
  profit_target_pct: 0.50       # Exit at 50% max profit
  stop_loss_multiplier: 2.0     # Exit at 2.0x credit received loss
  close_dte_threshold: 2        # Close position if DTE <= 2 to avoid gamma risk
  contango_min_ratio: 0.98      # Near IV / Next IV ratio threshold (<= 1.05 for normal contango)

execution:
  scan_cron_minutes: "*/5"
  trading_hours_only: true
  order_poll_timeout_sec: 60
  order_poll_interval_sec: 2
  limit_price_offset: 0.01

alerts:
  enabled: true
  webhook_url: ""

