[project]
name = "alpacha"
version = "0.2.0"
description = "HedgeMePlease: LangGraph iron condor agent for the Alpaca AI Trading Agents Hackathon"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "mcp>=1.2",
    "tzdata>=2024.1",
    "apscheduler>=3.10",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=1.0",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
alpacha = "alpacha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpacha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
